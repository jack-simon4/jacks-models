name: Update MLB Data

on:
  schedule:
    # 11 AM ET (15:00 UTC) daily — full refresh of pitchers, hitters, lineups, props
    - cron: '0 15 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: mlb-csv-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # needed for Firebase deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update MLB data
        run: |
          python scripts/update_mlb.py
          python scripts/generate_top_picks.py

      - name: Post MLB picks tweet
        continue-on-error: true
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python scripts/send_mlb_tweet.py

      - name: Upload updated CSVs to Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/upload_to_storage.py

      - name: Commit and push updated CSVs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/assets/MLB-Pitchers.csv src/assets/MLB-Hitters.csv src/assets/MLB-Lineups.csv src/assets/MLB-Player-Props.csv src/assets/MLB-Last-Lineups.csv src/assets/top-picks.json
          if git diff --staged --quiet; then
            echo "No CSV changes — nothing to commit."
          else
            git commit -m "chore: auto-update MLB data $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Stamp deploy date and build
        run: |
          TODAY=$(date +'%B %-d, %Y')
          sed -i "s/Last Updated: [A-Za-z]* [0-9]*, [0-9]*/Last Updated: $TODAY/" src/app/app.component.html
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}'
          channelId: live
          projectId: jesimon4-scoreboard
