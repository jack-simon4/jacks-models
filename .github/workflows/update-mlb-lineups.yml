name: Update MLB Lineups (Hourly)

on:
  schedule:
    # Noon–10 PM ET (16:00–02:00 UTC) — picks up lineups as teams post them
    - cron: '0 16-23 * * *'
    - cron: '0 0-2 * * *'
  workflow_dispatch:

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update lineups and player props
        run: |
          python scripts/fetch_mlb_lineups.py
          python scripts/fetch_mlb_player_props.py

      - name: Commit and push updated CSVs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/assets/MLB-Lineups.csv src/assets/MLB-Player-Props.csv
          if git diff --staged --quiet; then
            echo "No lineup changes — nothing to commit."
          else
            git commit -m "chore: auto-update lineups $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
