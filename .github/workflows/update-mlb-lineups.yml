name: Update MLB Lineups (Hourly)

on:
  schedule:
    # 9 AM–1 AM ET (13:00–05:00 UTC) — morning coverage through late West Coast finishes
    - cron: '0 13-23 * * *'
    - cron: '0 0-5 * * *'
  workflow_dispatch:

concurrency:
  group: mlb-csv-update
  cancel-in-progress: false

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # needed for Firebase deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update lineups and player props
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}
        run: |
          python scripts/fetch_mlb_lineups.py
          python scripts/fetch_mlb_player_props.py
          python scripts/generate_top_picks.py

      - name: Update completed game results in Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}
        run: python scripts/update_results.py

      - name: Upload updated CSVs to Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}
        run: python scripts/upload_to_storage.py

      - name: Commit and push updated CSVs
        id: commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/assets/MLB-Lineups.csv src/assets/MLB-Player-Props.csv src/assets/MLB-Last-Lineups.csv src/assets/top-picks.json
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No lineup changes — nothing to commit."
          else
            git commit -m "chore: auto-update lineups $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Stamp deploy date and build
        if: steps.commit.outputs.changed == 'true'
        run: |
          TODAY=$(date +'%B %-d, %Y')
          sed -i "s/Last Updated: [A-Za-z]* [0-9]*, [0-9]*/Last Updated: $TODAY/" src/app/app.component.html
          npm run build

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}'
          channelId: live
          projectId: jesimon4-scoreboard
