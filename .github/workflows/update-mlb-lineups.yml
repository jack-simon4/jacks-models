name: Update MLB Lineups (Hourly)

on:
  schedule:
    # Noon–1 AM ET (16:00–05:00 UTC) — picks up pre-game submissions and late West Coast finishes
    - cron: '0 16-23 * * *'
    - cron: '0 0-5 * * *'
  workflow_dispatch:

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update lineups and player props
        run: |
          python scripts/fetch_mlb_lineups.py
          python scripts/fetch_mlb_player_props.py
          python scripts/generate_top_picks.py

      - name: Upload updated CSVs to Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}
        run: python scripts/upload_to_storage.py

      - name: Commit and push updated CSVs
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/assets/MLB-Lineups.csv src/assets/MLB-Player-Props.csv src/assets/MLB-Last-Lineups.csv src/assets/top-picks.json
          if git diff --staged --quiet; then
            echo "No lineup changes — nothing to commit."
          else
            git commit -m "chore: auto-update lineups $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin main
            git push
          fi
