name: Update NCAAF Stats (Weekly)

on:
  schedule:
    # Thursday 8 AM ET (12:00 UTC) — picks for Thursday night games
    - cron: '0 12 * * 4'
    # Friday 8 AM ET (12:00 UTC) — picks for Friday night games
    - cron: '0 12 * * 5'
    # Saturday 8 AM ET (12:00 UTC) — picks for Saturday games
    - cron: '0 12 * * 6'
    # Sunday 2 AM ET (06:00 UTC) — captures Saturday results, updates stats
    - cron: '0 6 * * 0'
    # Monday 2 AM ET (06:00 UTC) — captures Sunday game results
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-ncaaf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch and update NCAAF team stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/fetch_ncaaf_stats.py

      - name: Generate NCAAF picks
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/generate_ncaaf_picks.py

      - name: Commit updated NCAAF stats and picks
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/assets/NCAAF-Stats.csv src/assets/ncaaf-picks.json
          if git diff --staged --quiet; then
            echo "No NCAAF changes — nothing to commit."
          else
            git commit -m "chore: auto-update NCAAF stats $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
