# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
    paths-ignore:
      - 'src/assets/MLB-Lineups.csv'
      - 'src/assets/MLB-Player-Props.csv'
      - 'src/assets/MLB-Last-Lineups.csv'
      - 'src/assets/MLB-Hitters.csv'
      - 'src/assets/MLB-Pitchers.csv'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}'
          channelId: live
          projectId: jesimon4-scoreboard
