name: Daily Email Report

# Runs at 12:00 UTC (8:00 AM ET) — after all morning data jobs have finished:
#   NCAAM  6:00 UTC  |  NBA  7:00 UTC  |  Soccer  8:30 UTC  |  Deploy  9:00 UTC

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate social pick cards
        continue-on-error: true
        run: python scripts/generate_social_cards.py

      - name: Send daily email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESIMON4_SCOREBOARD }}
        run: python scripts/send_daily_email.py
